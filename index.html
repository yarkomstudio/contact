    <title>Ростислав Ярком | Художник, графический дизайнер</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1d1f;
            color: #e0e0e0;
        }

        .page-home {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1a1d1f;
            min-height: 100vh;
        }

        .cover-image {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            max-height: 300px;
        }

        .vcard-header {
            background: linear-gradient(135deg, #d97a3c 0%, #b85c28 100%);
            padding: 10px 0;
            text-align: center;
        }
        .event-title {
            font-size: 28px;
            font-weight: 700;
            color: #fff2e0;
        }
        .event-teaser {
            font-size: 16px;
            color: #ffe1c4;
            margin-top: 8px;
        }

        .event-body {
            padding: 20px;
        }

        /* ========== КНОПКИ-ССЫЛКИ С ВИДИМОЙ ОКОНТОВКОЙ ========== */
        .channel-container {
            display: block;
            background-color: #4a4a4e;        /* ТЁПЛЫЙ СЕРЫЙ — внешний слой (оконтовка) */
            border-radius: 28px;
            margin-bottom: 16px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            padding: 3px;                     /* ВАЖНО: отступ создаёт видимую рамку */
        }
        .channel-container:hover {
            transform: translateY(-2px);
            background-color: #5a5a5e;        /* при наведении внешний слой светлее */
        }

        .channel-inner {
            display: flex;
            align-items: center;
            background-color: #1a1d1f;        /* ТЁМНО-СЕРЫЙ — внутренняя часть */
            border-radius: 25px;
            padding: 10px 20px;
            transition: background 0.2s;
        }
        .channel-container:hover .channel-inner {
            background-color: #25282b;         /* при наведении внутренний чуть светлее */
        }

        .channel-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            flex-shrink: 0;
        }
        .channel-icon svg {
            width: 48px;
            height: 48px;
            display: block;
        }

        .channel-name {
            font-size: 19px;
            font-weight: 600;
            color: #f0f0f0;
        }
        .channel-label {
            font-size: 13px;
            color: #c0c0c0;
            margin-top: 4px;
        }

        .share-container {
            margin-top: 36px;
            text-align: center;
        }
        .fab {
            display: inline-block;
            background: linear-gradient(105deg, #ed8a4a, #cf6729);
            padding: 14px 32px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px rgba(0,0,0,0.25);
        }
        .fab:hover {
            background: linear-gradient(105deg, #f59756, #e0702e);
            transform: translateY(-2px);
        }

        .copy-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #e07c3c;
            color: #fff2e4;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .copy-message.show {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .event-title { font-size: 26px; }
            .channel-inner { padding: 8px 18px; }
            .channel-icon svg { width: 44px; height: 44px; }
            .cover-image { max-height: 210px; }
            .fab { padding: 12px 28px; font-size: 16px; }
        }
    </style>
</head>

<script>
    const pageUrl = window.location.href;
    const shareBtn = document.getElementById('shareButton');
    const copyMsg = document.getElementById('copyMessage');

    shareBtn.addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({
                title: 'Ростислав Ярком',
                text: 'Художественная роспись и декор',
                url: pageUrl
            }).catch(err => console.log('Ошибка:', err));
        } else {
            const textarea = document.createElement('textarea');
            textarea.value = pageUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            copyMsg.classList.add('show');
            setTimeout(() => copyMsg.classList.remove('show'), 2000);
        }
    });
</script>
